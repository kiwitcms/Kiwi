{% extends "tcms_ui_custom/settings/base_settings.html" %}

{% block settings_content %}
<div class="jira-card-header">
    <h1 class="jira-title">Priorities</h1>
</div>

<div class="row">
    <div class="col-md-5">
        <div class="jira-card">
            <h3 class="jira-title font-16 mb-16">+ Add Priority</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="form-group mb-16">
                    <label class="text-bold font-14 mb-16">Priority Value</label>
                    <input type="text" name="value" class="form-control" required placeholder="e.g., P1">
                </div>
                <button type="submit" class="btn-jira-primary w-100">Add Priority</button>
            </form>
        </div>
    </div>
    
    <div class="col-md-7">
        <div class="jira-card p-0 overflow-hidden">
            <table class="jira-table">
                <thead>
                    <tr>
                        <th>Value</th>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in priorities %}
                    <tr>
                        <td>
                            <!-- Display Mode -->
                            <div class="edit-display-mode flex-between">
                                <span class="text-bold font-14">{{ p.value }}</span>
                                <div style="display: flex; gap: 10px;">
                                    <button class="icon-btn edit-btn icon-primary" title="Edit">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    
                                    {% if p.pk in priorities_in_use_ids %}
                                        <button class="icon-btn icon-gray" title="This priority is in use and cannot be deleted." disabled style="cursor: not-allowed; opacity: 0.6;">
                                            <i class="fa-solid fa-lock"></i>
                                        </button>
                                    {% else %}
                                        <button class="icon-btn delete-btn icon-danger" data-url="{% url 'priority_delete' p.pk %}" data-name="{{ p.value }}" title="Delete">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    {% endif %}
                                </div>
                            </div>

                            <!-- Edit Mode -->
                            <form method="POST" action="{% url 'priority_edit' p.pk %}" class="edit-edit-mode" style="display: none;">
                                {% csrf_token %}
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <input type="text" name="value" class="form-control item-edit-input" value="{{ p.value }}" style="max-width: 200px;">
                                    <button type="submit" class="icon-btn icon-success" title="Save">
                                        <i class="fa-solid fa-floppy-disk"></i>
                                    </button>
                                    <button type="button" class="icon-btn cancel-btn icon-gray" title="Cancel">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
