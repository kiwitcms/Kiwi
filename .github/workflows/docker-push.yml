name: docker-push

on:
  push:
    branches: master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build_and_push:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build for ${{ github.event.ref }}
        run: |
            make docker-image

            echo "+++++ Docker images +++++"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t$(date '+%d %b %Y')\t{{.Size}}"

      - name: Push docker image for ${{ github.event.ref }}
        run: |
            # tag both the new and the legacy image names
            # from the same locally built image
            docker tag pub.kiwitcms.eu/kiwitcms/kiwitcms:latest kiwitcms/kiwitcms:latest
            docker tag pub.kiwitcms.eu/kiwitcms/kiwitcms:latest kiwitcms/kiwi:latest

            echo "+++++ Docker images +++++"
            docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t$(date '+%d %b %Y')\t{{.Size}}"

            echo "${{ secrets.DOCKER_PUSH_TOKEN }}" | docker login -u="${{ secrets.DOCKER_PUSH_USERNAME }}" --password-stdin
            docker push kiwitcms/kiwitcms:latest
            docker push kiwitcms/kiwi:latest
            docker logout

      - name: Remove container registry credentials
        if: always()
        run: |
          docker logout || true
          rm -f ~/.docker/config.json
